---
- name: Check if worktrunk is installed
  ansible.builtin.stat:
    path: "{{ worktrunk_install_path }}"
  register: wt_binary

- name: Get installed worktrunk version
  ansible.builtin.command: "{{ worktrunk_install_path }} --version"
  register: wt_version_cmd
  changed_when: false
  failed_when: false
  when: wt_binary.stat.exists

- name: Determine if worktrunk install is needed
  ansible.builtin.set_fact:
    worktrunk_needs_install: >-
      {{ (not wt_binary.stat.exists)
         or (worktrunk_version | regex_replace('^v', '') not in ((wt_version_cmd.stdout | default('')) ~ ' ' ~ (wt_version_cmd.stderr | default('')))) }}

- name: Download worktrunk
  ansible.builtin.get_url:
    url: "{{ worktrunk_download_url }}"
    dest: "{{ worktrunk_download_dest }}"
    mode: "0644"
  when: worktrunk_needs_install

- name: Clean worktrunk extract directory
  ansible.builtin.file:
    path: "{{ worktrunk_extract_dir }}"
    state: absent
  when: worktrunk_needs_install

- name: Create worktrunk extract directory
  ansible.builtin.file:
    path: "{{ worktrunk_extract_dir }}"
    state: directory
    mode: "0755"
  when: worktrunk_needs_install

- name: Extract worktrunk
  ansible.builtin.unarchive:
    src: "{{ worktrunk_download_dest }}"
    dest: "{{ worktrunk_extract_dir }}"
    remote_src: yes
  when: worktrunk_needs_install

- name: Find extracted worktrunk binary
  ansible.builtin.find:
    paths: "{{ worktrunk_extract_dir }}"
    patterns:
      - wt
      - worktrunk
    file_type: file
    recurse: yes
  register: worktrunk_candidates
  when: worktrunk_needs_install

- name: Ensure extracted worktrunk binary exists
  ansible.builtin.assert:
    that:
      - worktrunk_candidates.matched | int > 0
    fail_msg: "Could not find extracted worktrunk binary in {{ worktrunk_extract_dir }}"
  when: worktrunk_needs_install

- name: Install worktrunk binary
  ansible.builtin.copy:
    src: "{{ (worktrunk_candidates.files | map(attribute='path') | list | first) }}"
    dest: "{{ worktrunk_install_path }}"
    mode: "0755"
    remote_src: yes
  when: worktrunk_needs_install

- name: Clean up worktrunk tarball
  ansible.builtin.file:
    path: "{{ worktrunk_download_dest }}"
    state: absent
  when: worktrunk_needs_install

- name: Clean up worktrunk extract directory
  ansible.builtin.file:
    path: "{{ worktrunk_extract_dir }}"
    state: absent
  when: worktrunk_needs_install
